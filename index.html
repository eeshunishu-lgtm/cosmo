<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmo">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<title>Cosmo — Local AI (Offline)</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Cosmo Offline AI&quot;,&quot;short_name&quot;:&quot;Cosmo&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;background_color&quot;:&quot;#0c0d10&quot;,&quot;theme_color&quot;:&quot;#5b8cff&quot;,&quot;icons&quot;:[]}">
<style>
:root{--bg:#f8f7f4;--panel:#ffffff;--bubble:#f0eee8;--text:#1c1b19;--muted:#88857e;
  --accent:#ff6a3d;--border:#e7e4dc;--sidebar:#f3f1ec;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0c0d10;--panel:#16181d;--bubble:#1e2128;--text:#eceef1;
    --muted:#8b909c;--accent:#ff6a3d;--border:#262a33;--sidebar:#111318;}
}
:root[data-theme="dark"]{--bg:#0c0d10;--panel:#16181d;--bubble:#1e2128;--text:#eceef1;--muted:#8b909c;--accent:#ff6a3d;--border:#262a33;--sidebar:#111318}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#app{display:flex;height:100%;position:relative}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.overlay.show{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;height:100%;width:280px;max-width:85vw;background:var(--sidebar);
  border-right:1px solid var(--border);z-index:21;transform:translateX(-100%);transition:transform .22s ease;
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 14px}
.sidebar.show{transform:translateX(0)}
.sidebarBrand{font-size:1.15rem;font-weight:700;margin:0 6px 16px;display:flex;align-items:center;gap:8px}
.newChatBtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--text);cursor:pointer;margin-bottom:12px}
.sidebarLabel{font-size:.76rem;color:var(--muted);margin:8px 8px 6px;text-transform:uppercase;letter-spacing:.03em}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.chatItem{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;
  border-radius:10px;cursor:pointer;font-size:.87rem}
.chatItem:hover,.chatItem.active{background:var(--bubble)}
.chatItem .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chatItem .del{color:var(--muted);font-size:.85rem;padding:2px 6px;flex-shrink:0}
#mainArea{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;flex-shrink:0}
.iconBtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:1rem}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:8px 12px;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-color:var(--accent);font-weight:600}
main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#chatPane{flex:1;display:flex;flex-direction:column;min-height:0}
#homeScreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;text-align:center}
#homeScreen .logo{width:auto;height:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
#homeScreen .logo .brandLogo{max-width:min(340px,85vw);height:auto;filter:drop-shadow(0 0 22px rgba(80,140,255,.4))}
#homeScreen .logo .emblem{width:64px;height:64px;object-fit:contain;display:none}
#homeScreen h2{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:1.35rem;margin:0;color:var(--muted)}
.headerBrand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem}
.headerBrand img{height:26px;width:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(80,140,255,.45))}
#chatLog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msgRow{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.msgRow.userRow{justify-content:flex-end}
.avatar{width:32px;height:32px;border-radius:50%;background:transparent;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:.94rem;line-height:1.5;white-space:pre-wrap}
.msg.user{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{background:var(--bubble);border-bottom-left-radius:4px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--border);
  background:var(--panel);flex-shrink:0}
.composer textarea{flex:1;min-height:22px;max-height:110px;background:var(--bubble);color:var(--text);
  border:1px solid var(--border);border-radius:18px;padding:10px 14px;font-size:.94rem;resize:none;font-family:inherit}
#sendBtn,#callBtn,#micBtn{width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
#sendBtn{background:var(--accent);color:#fff;border:none}
#micBtn{background:var(--bubble);color:var(--text);border:1px solid var(--border);width:40px;height:40px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
#micBtn svg{width:22px;height:22px;display:block;opacity:.9}
#micBtn.listening{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 0 0 4px rgba(239,68,68,.25);animation:micPulse 1.2s ease-in-out infinite}
#micBtn.listening svg{opacity:1}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 4px rgba(239,68,68,.25)}50%{box-shadow:0 0 0 10px rgba(239,68,68,.12)}}

#sendBtn:disabled{opacity:.4}
#callBtn{background:var(--bubble);color:var(--muted);border:1px solid var(--border)}
#callBtn.active{background:#22c55e;color:#fff;border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
#callBtn.speaking{animation:pulseCall 1.2s ease-in-out infinite}
#callBtn img{width:18px;height:18px;object-fit:contain;pointer-events:none}
#callBtn.speaking{background:#ef4444!important;border-color:#ef4444!important;color:#fff}
#callBtn.speaking img{filter:brightness(10)}

@keyframes pulseCall{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.25)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.15)}}
#gamesPane{flex:1;overflow-y:auto;padding:16px;display:none}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:6px}
#idea{width:100%;min-height:78px;background:transparent;color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:10px;font-size:.94rem;resize:vertical;font-family:inherit}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.pill{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;
  font-size:.88rem;font-weight:600;cursor:pointer}
button.pill.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
button.pill.small{padding:6px 11px;font-size:.8rem}
button.pill:disabled{opacity:.45}
#gstatus{color:var(--muted)}
